# =============================================================================
# Vehicle Undercarriage Inspection System — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop all services
# =============================================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: undercarriage_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/undercarriage_db
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-very-long-random-string}
      - EDGE_API_KEY=${EDGE_API_KEY:-change-me-to-a-secure-key}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_PATH=/app/data/images
      - MODEL_DIR=/app/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:3000
    volumes:
      - backend_data:/app/data
      - model_data:/app/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (React + Vite) ──────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for TLS
    depends_on:
      - backend
      - frontend
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro  # Uncomment for TLS
    restart: unless-stopped

volumes:
  pgdata:
  backend_data:
  model_data:
