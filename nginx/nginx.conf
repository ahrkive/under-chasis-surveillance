upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # Redirect to HTTPS in production
    # return 301 https://$host$request_uri;

    # For development, serve directly on port 80
    include /etc/nginx/conf.d/locations.conf;
}

